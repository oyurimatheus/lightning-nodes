# Application defaults. Every key here can be overridden by an environment
# variable; see README "Configuration" and .env.example for the mapping.

[server]
host = "0.0.0.0"
port = 3000

[database]
read_pool_max_connections = 10
write_pool_max_connections = 2
acquire_timeout_seconds = 5

[mempool]
base_url = "https://mempool.space"
timeout_seconds = 10

[synchronization]
interval_seconds = 600
batch_size = 500
sync_on_startup = true
reject_empty_response = true

[history]
retention_days = 30
minimum_successful_snapshots = 3

[api]
include_saved_at = true
