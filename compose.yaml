services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lightning
      POSTGRES_PASSWORD: lightning
      POSTGRES_DB: lightning
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightning -d lightning"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://lightning:lightning@postgres:5432/lightning
      MEMPOOL_BASE_URL: https://mempool.space
      SYNC_INTERVAL_SECONDS: "600"
      API_INCLUDE_SAVED_AT: "true"
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
