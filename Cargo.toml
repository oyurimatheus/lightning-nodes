[package]
name = "nodes-svc"
version = "0.1.0"
edition = "2024"
description = "Lightning Network nodes backend: imports connectivity rankings from mempool.space, versions them as immutable PostgreSQL snapshots, and serves the latest published snapshot."
license = "MIT"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
testcontainers-modules = { version = "0.13", features = ["postgres"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
