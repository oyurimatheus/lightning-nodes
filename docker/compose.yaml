# Full local stack: PostgreSQL (from containers/postgres.yaml) + application.
# The Dockerfile stays at the repository root; the build context is the repo.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://lightning:lightning@postgres:5432/lightning
      MEMPOOL_BASE_URL: https://mempool.space
      SYNC_INTERVAL_SECONDS: "600"
      API_INCLUDE_SAVED_AT: "true"
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

include:
  - ./containers/postgres.yaml
